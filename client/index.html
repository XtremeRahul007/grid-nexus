<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>client</title>
  </head>
  <body class="bg-slate-800 text-slate-300">
    <header></header>
    <main>
      <section>
        <h2><u>Registration Form</u></h2>
        <form id="register-form">
          <div>
            <p>Email:</p>
            <input
              name="email"
              type="email"
              placeholder="Enter email here..."
              required
            />
          </div>
          <div>
            <p>Username:</p>
            <input
              name="username"
              type="text"
              placeholder="Enter username here..."
              required
            />
          </div>
          <div>
            <p>Password:</p>
            <input
              name="password"
              type="password"
              placeholder="Enter password here..."
              required
            />
          </div>
          <button type="submit">REGISTER</button>
        </form>
        <br />

        <h2><u>Login Form</u></h2>
        <form id="login-form">
          <div>
            <p>Email:</p>
            <input
              name="email"
              type="email"
              placeholder="Enter email here..."
              required
            />
          </div>
          <div>
            <p>Password:</p>
            <input
              name="password"
              type="password"
              placeholder="Enter password here..."
              required
            />
          </div>
          <button type="submit">LOGIN</button>
        </form>
        <br />

        <h2><u>Delete Account</u></h2>
        <form id="delete-account-form">
          <div>
            <p>Password:</p>
            <input
              name="password"
              type="password"
              placeholder="Enter password here..."
              required
            />
          </div>
          <button type="submit">DELETE</button>
        </form>
        <br />

        <h2><u>Response Area</u></h2>
        <div>
          <textarea
            id="serverResponseContainer"
            name="message"
            rows="5"
            cols="40"
            placeholder="Response will appear here..."
            readonly
          ></textarea>
        </div>
        <div>
          <button type="button" id="showUserName">Show Username</button>
          <p id="userName"></p>
        </div>
        <div>
          <button type="button" id="logoutButton">Logout</button>
        </div>
        <div>
          <button type="button" id="logoutEveryWhereButton">
            Logout Everywhere
          </button>
        </div>
      </section>
    </main>
    <footer></footer>
    <script defer type="module" src="/src/main.ts"></script>
  </body>
</html>
